name: daily-refresh

on:
  schedule:
    # Every 3 hours (00:43, 03:43, ... UTC). fetch.py skips if the last check was under 2 hours ago,
    # so a code push right after a scheduled run doesn't spend API calls. ~8 runs/day, well under 100 calls.
    - cron: '43 */3 * * *'
  push:
    branches: [main]   # deploy code changes; the bot's own data commits don't re-trigger
  workflow_dispatch:
    inputs:
      force:
        description: Re-fetch even if checked in the last 2 hours
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # fetch.py skips (skip=true) when the last check was under 2 hours ago; then only the data commit is skipped,
      # and the site is still tested, built and deployed (so manual runs and code pushes always deploy).
      - name: Fetch
        id: fetch
        run: python scripts/fetch.py ${{ inputs.force && '--force' || '' }}
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}

      - name: Test and build
        run: |
          python -m unittest discover -s tests
          python scripts/build.py

      - name: Commit data
        if: steps.fetch.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "data: $(date -u +%F)" || echo 'no changes'
          git pull --rebase
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
